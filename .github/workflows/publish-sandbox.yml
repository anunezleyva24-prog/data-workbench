name: Publish sandbox code to live

# Run by hand from the Actions tab: "Run workflow".
# Copies the code in sandbox/ to the live site (the repository root). Data is never touched.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the sandbox code to the live site
        run: tools/promote.sh

      - name: Commit and push
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The live site already matches the sandbox. Nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish sandbox code to live"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"

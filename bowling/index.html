<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Bowling Night Stats</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Bowling Night Stats</h1>
    <p class="sub" id="subtitle"></p>
    <div id="badge" class="badge" role="status"></div>
    <nav class="nav" aria-label="Sections">
      <a href="#leaderboard">Leaderboard</a>
      <a href="#allgames">All games</a>
      <a href="#highlights">Highlights</a>
      <a href="#scorecards">Scorecards</a>
      <a href="#charts">Charts</a>
      <a href="#stats">Player stats</a>
      <a href="#glossary">Glossary</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="summary" aria-label="Event summary"></section>
  <section id="detail" class="panel detail" hidden aria-live="polite"></section>
  <section id="leaderboard" class="panel"></section>
  <section id="allgames" class="panel"></section>
  <section id="highlights" class="panel"></section>
  <section id="scorecards" class="panel"></section>
  <section id="charts" class="panel"></section>
  <section id="stats" class="panel"></section>
  <section id="glossary" class="panel"></section>
</main>

<footer class="wrap foot" id="foot"></footer>
<noscript><p class="wrap">This page needs JavaScript to compute and draw the statistics.</p></noscript>

<script src="data.js"></script>
<script src="scoring.js"></script>
<script src="app.js"></script>
</body>
</html>
